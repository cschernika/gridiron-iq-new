name: Weekly NFL statistics refresh

on:
  schedule:
    # Primary refresh after Monday Night Football and the Tuesday data publish.
    # 19:17 UTC is 3:17 PM Eastern during daylight time (2:17 PM standard).
    - cron: "17 19 * * 2"
    # Wednesday safety run catches any delayed stat corrections or source files.
    # If nothing changed, the workflow exits without creating another commit.
    - cron: "17 19 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-nfl-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Gridiron IQ
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and rebuild weekly statistics
        run: python refresh_weekly_data.py --season 2026 --matchup-season 2026

      - name: Validate refreshed files
        run: |
          python -m py_compile app.py refresh_weekly_data.py build_defensive_snapshot.py
          python - <<'PY'
          import json
          from pathlib import Path

          offense = Path("data/nfl_player_stats_2026.json")
          if offense.exists():
              payload = json.loads(offense.read_text(encoding="utf-8"))
              assert payload.get("season") == 2026
              assert payload.get("player_count", 0) > 100

          defense = Path("data/nfl_defensive_stats_current.json")
          if defense.exists():
              payload = json.loads(defense.read_text(encoding="utf-8"))
              assert payload.get("season") == 2026
              assert len(payload.get("teams", {})) >= 28
              assert len(payload.get("offensive_lines", {})) >= 28
              assert len(payload.get("schedule_2026", [])) >= 200
              assert int(payload.get("data_through_week", 0)) >= 1
              assert all(
                  row.get("run_blocking_grade") is not None
                  for row in payload.get("offensive_lines", {}).values()
              )
              assert all(
                  row.get("run_defense_grade") is not None
                  for row in payload.get("teams", {}).values()
              )
          PY

      - name: Commit changed snapshots
        run: |
          for snapshot in data/nfl_player_stats_2026.json data/nfl_defensive_stats_current.json; do
            if [ -f "$snapshot" ]; then git add "$snapshot"; fi
          done
          if git diff --cached --quiet; then
            echo "No new weekly statistics were published."
            exit 0
          fi
          git config user.name "Gridiron IQ Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: refresh weekly NFL statistics"
          git push
