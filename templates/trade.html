{% extends "base.html" %}{% block title %}Trade Analyzer | Gridiron IQ{% endblock %}{% block heading %}Trade Analyzer{% endblock %}
{% block body %}<section class="page-intro"><span class="pill">Trade Lab</span><h2>Compare trade value and team fit</h2><p>Separate multiple players with commas.</p></section>
<section class="panel narrow"><div class="form-grid"><label>You give<input id="trade-give" placeholder="Example: Player A, Player B"></label><label>You receive<input id="trade-receive" placeholder="Example: Player C"></label><label>Scoring<select id="trade-scoring"><option>Standard</option><option selected>Half-PPR</option><option>Full PPR</option></select></label></div><button class="button primary" id="analyze-trade">Analyze Trade</button><pre class="result" id="trade-result">Enter both sides of the trade.</pre></section>{% endblock %}
