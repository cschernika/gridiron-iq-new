name: Complete player career history

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 15 1 *"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: player-career-history
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Gridiron IQ
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build all completed player seasons
        shell: bash
        run: |
          END_SEASON=$(( $(date -u +%Y) - 1 ))
          python build_career_history.py --start-season 1999 --end-season "$END_SEASON"

      - name: Validate career history
        run: |
          python -m py_compile app.py build_career_history.py
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/nfl_player_career_history.json").read_text(encoding="utf-8"))
          assert data.get("season_count", 0) >= 27
          assert len(data.get("players", {})) >= 3000
          assert all(str(year) in {str(value) for value in data["loaded_seasons"]} for year in range(1999, 2026))
          PY

      - name: Commit complete career history
        run: |
          git add data/nfl_player_career_history.json
          git config user.name "Gridiron IQ Career Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: refresh complete player career history" || exit 0
          git push
